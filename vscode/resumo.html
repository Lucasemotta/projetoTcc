<!DOCTYPE html>
<html lang="en">
   <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGENDAMENTO</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 420px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border: 1px solid #ccc;
        }

        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #aaa;
        }

        .salas label {
            display: inline-block;
            margin-right: 20px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            border: none;
            background: #333;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <main class="container">
        

        <form>

            <label>AGENDAMENTO FINALIZADO!</label> <BR>
            <div class="salas">

                AGENDADO PARA O DIA: 10/10 <BR> <BR>
                ÁS: 15:00 h <BR> <BR>
                VALOR TOTAL: R$40,00  
                
            </div>

            

                  

        </form>
    </main>


</body>

</html>
