<!DOCTYPE html>
<html lang="en">
   <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGENDAMENTO</title>

    <link rel="stylesheet" href="tcc.css"> 

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #181411;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 420px;
            margin: 0 auto;
            background: rgb(0, 0, 0);
            padding: 30px;
            border: 1px solid #ccc;
        }

        h1 {
            font-size: 24px;
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #aaa;
        }

        .salas label {
            display: inline-block;
            margin-right: 20px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            border: none;
            background: #e63e0b;
            color: rgb(0, 0, 0);
            cursor: pointer;
        }

        
    </style>


</head>

    <body>

    <main class="container">
        

       

            <label>TIPO DE CORTE:</label>
            <div class="salas">
                <label><input type="checkbox" name="sala" value="01"> CABELO (R$40,00)</label> <BR>
                <label><input type="checkbox" name="sala" value="02"> BARBA (R$20,00)</label> <BR>
                <label><input type="checkbox" name="sala" value="03"> SOBRANCELHA (R$10,00) </label> <BR>
            </div>

            <label>DATA:</label>

<div class="calendario">

    <div class="calendario-cabecalho">

        <button type="button" id="mesAnterior">‹</button>

        <h2 id="mesAno"></h2>

        <button type="button" id="proximoMes">›</button>

    </div>

    <div class="dias-semana">
        <span>DOM</span>
        <span>SEG</span>
        <span>TER</span>
        <span>QUA</span>
        <span>QUI</span>
        <span>SEX</span>
        <span>SÁB</span>
    </div>

    <div class="dias" id="dias"></div>

</div>

<label for="horario">HORÁRIO:</label>

<select id="horario">
    <option value="">Selecione uma data primeiro</option>
</select>
  
            <button type="submit">CONFIRMAR</button>
                    

        
    </main>

    <script src="js/script.js"></script>
</body>

</html>
